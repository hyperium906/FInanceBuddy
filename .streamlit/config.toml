# Checked in deliberately: these are deployment settings, not secrets.
# Secrets live in .streamlit/secrets.toml, which is gitignored.

[server]
# The app writes to your spreadsheet. Uploading a CSV is the only file input
# it needs, and bank exports are small, so cap the upload well below the
# default 200 MB rather than accepting arbitrary payloads.
maxUploadSize = 10
# Both left on (the defaults, stated here so they are not turned off by
# accident). XSRF protection guards the upload and form routes; CORS is what
# actually restricts which origins may open the WebSocket the whole UI runs
# over. Turning CORS off lets any page connect — Streamlit warns about exactly
# this — and an app that can rewrite your spreadsheet should not accept that.
enableXsrfProtection = true
enableCORS = true

[browser]
# No usage statistics off a machine that is reading your finances.
gatherUsageStats = false

[client]
# A stack trace in the browser can carry spreadsheet contents and cell values.
# shell.py already turns failures into readable messages with a retry button.
showErrorDetails = "none"

[theme]
# Dark by default. Both palettes below are defined, so the hamburger menu ->
# Settings -> Appearance can switch to light and the choice sticks per browser;
# `base` only decides what a viewer sees before they express a preference.
#
# Options set here apply to BOTH themes -- [theme.light] and [theme.dark]
# extend this table rather than replacing it -- so anything that should not
# change with the theme belongs here and nowhere else.
base = "dark"

# The teal the app already uses for "on track" in the dashboard, goals, and
# the buy advisor. Reusing it means the accent and the status colours are one
# palette rather than two that happen to sit next to each other.
primaryColor = "#2a9d8f"

[theme.light]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f5f7"
textColor = "#16191d"
borderColor = "#dfe3e8"

[theme.dark]
# Not pure black: a slightly blue-grey ground keeps the white text from
# haloing, and gives the cards a step to sit on without adding a border.
backgroundColor = "#11151a"
secondaryBackgroundColor = "#1a2029"
textColor = "#e3e6ea"
borderColor = "#2b333f"
